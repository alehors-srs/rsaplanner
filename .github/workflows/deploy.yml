name: Deploy planner to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsaplanner-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and deploy main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require main branch
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [ "$DEPLOY_REF" != "refs/heads/main" ]; then
            echo "::error::Select main in the Run workflow menu."
            exit 1
          fi

      - name: Check out selected commit
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check JavaScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Deploy rsaplanner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            exit 1
          fi
          npx --yes wrangler@4.158.0 deploy

      - name: Record deployed commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          echo "Published commit $DEPLOY_SHA to Worker rsaplanner." >> "$GITHUB_STEP_SUMMARY"
